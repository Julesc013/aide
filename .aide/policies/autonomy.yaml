schema_version: aide.autonomy-policy.v0
principle: Fully autonomous work must still be queue-driven, evidence-backed, and policy-bounded.
levels:
  readonly:
    description: Inspect files, summarize state, and run non-mutating commands.
    edits_allowed: false
    queue_required: false
  plan_only:
    description: Produce or update plans without implementation edits beyond approved planning surfaces.
    edits_allowed: limited
    queue_required: when_non_trivial
  bounded_edit:
    description: Make scoped edits inside explicit allowed paths with validation and evidence.
    edits_allowed: true
    queue_required: when_non_trivial
  review_gated:
    description: Make bounded progress but stop before hard gates, completion acceptance, or policy-sensitive transitions.
    edits_allowed: true
    queue_required: true
  denied:
    description: Refuse or stop because the requested action violates policy, scope, safety, or evidence requirements.
    edits_allowed: false
    queue_required: not_applicable
requirements:
  - Respect allowed paths and forbidden paths.
  - Preserve bootstrap-era history and user changes.
  - Record validation evidence for substantial work.
  - Stop at review gates instead of acting silently.

owner_directed_adaptation:
  instruction_ref: .aide/queue/AIDE-REASONABLE-AUTOMATION-01/evidence/owner-instruction.md
  authority_scope: this_source_campaign_only_targets_require_their_own_local_admission
  routine_formatting: correct_mechanically_when_meaning_is_preserved_otherwise_leave_harmless_history
  substantive_description_changelog_and_evidence: investigate_do_not_invent_facts_or_pass_results
  necessary_tests: authorized_within_recorded_finite_scope_and_existing_signed_in_OpenAI_Codex_access
  additional_purchases_API_billing_fallback_or_provider_subscriptions: not_authorized
  unavailable_service: retain_its_exact_unqualified_capability_use_adequate_authorized_alternative_and_continue_independent_work
  resources: reuse_approved_storage_and_owned_retirement_preserve_finite_attempts_memory_disk_reserves
  unchanged_blocker: deterministic_observation_only_no_resubmission_or_model_recheck
  consequential_effects: existing_exact_technical_security_and_release_gates_remain

