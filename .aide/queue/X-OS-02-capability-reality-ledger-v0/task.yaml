acceptance:
  - X-OS-02 queue packet exists and ends at needs_review.
  - Capability seed records exist and are validated against controlled vocabularies.
  - Capability observation, ledger, and overclaim schemas exist and parse.
  - AIDE Lite exposes capability status, scan, ledger, overclaim-report, and validate commands.
  - Commands are deterministic, no-call, report-only, and standard-library-only.
  - Capability reports classify documented, report-only, no-call, dry-run, release-draft, target-pilot, tested, exposed, deprecated, removed, planned, specified, stubbed, implemented, and unknown states without upgrading claims beyond evidence.
  - Overclaim reports flag likely overclaims or explicitly explain when none are found.
  - Tests and six golden tasks cover the command surface, ledger generation, overclaim handling, no-apply boundaries, and export-pack inclusion.
  - Export pack includes portable capability contracts and command support according to current export policy.
  - Latest task packet points to AIDE-CHECK-OS-01 or a real blocker repair.
  - Validation evidence exists and warnings are classified.
review_gate: required
