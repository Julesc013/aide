objective: >
  Implement deterministic, standard-library-only, report-only capability reality
  scanning and ledger surfaces for AIDE Task OS so planned, specified, stubbed,
  implemented, tested, exposed, documented, deprecated, removed, and unknown
  capabilities can be classified without apply behavior, branch mutation, target
  mutation, release publication, provider/model calls, or network calls.
