objective: >
  Extend the delivered AIDE Lite importer with a target-local ownership
  baseline, exact plan binding, conflict-first update behavior, and durable
  interruption evidence so extracted packs can perform supported updates in
  disposable consumer repositories without overwriting target-owned edits.
authority_basis: >
  The owner explicitly directed the admitted convergence campaign to implement
  the stable product lifecycle and supplied the stable implementation mission's
  delivered-pack adoption and update slice. This child remains bounded to
  disposable consumer fixtures and preserves all retained live-target and
  publication gates.
