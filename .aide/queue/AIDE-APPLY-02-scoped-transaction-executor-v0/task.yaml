review_gate: queue_review_required
acceptance:
  - Scoped executor implementation is limited to explicit operator-provided paths.
  - Operation allowlists are explicit and reject unsupported, missing, or ambiguous operation types.
  - Managed-section operations are the default operation class.
  - Path boundaries, allowed roots, protected roots, and path traversal checks are enforced.
  - Dry-run/report mode produces no file mutation.
  - Apply mode, if implemented, is separately explicit and records evidence.
  - Preimage hash checks run before mutation and block mismatch.
  - Postimage verification runs after planned mutation and reports mismatch.
  - Staged-change and rollback-compatible records are generated.
  - Missing, duplicate, malformed, nested, unsupported, and ambiguous managed-section states block mutation.
  - Manual content outside managed markers is preserved.
  - Targeted unit tests and fixture tests cover the required safety cases.
  - Managed-section validation, transaction validation, git diff checks, and secret scan are recorded in evidence.
  - Capability reality labels remain implemented/tested/review-gated only when supported by evidence and are not production-ready.
  - Status ends at needs_review after implementation.
