planning_decisions:
  - Build v1 as reconciliation and normalization over Q43-Q48, not a rewrite.
  - Keep Q43-Q48 latest-* outputs as source-repo evidence, never target truth.
  - Promote DistributionManifest v1 first because ProjectLock, OwnershipLedger, InstallRecord, MigrationRecord, UpdatePlan, RollbackBundle, and UpdateReceipt all need a stable distribution identity.
  - Keep install/update/repair/rollback/uninstall apply behavior out of this planning task.
  - Require every v1 build to have independent check and acceptance before downstream v1 objects depend on it.
  - Treat the AIDE source repository as a source and fixture author, not an installed target.
  - Require an AIDE self-consumer fixture before real-project canaries.
