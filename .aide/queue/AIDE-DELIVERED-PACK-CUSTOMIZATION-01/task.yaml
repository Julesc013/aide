schema_version: aide.queue-task.v0
id: AIDE-DELIVERED-PACK-CUSTOMIZATION-01
title: Explain and retain downstream customization across portable updates
type: delivered_consumer_behavior
status: running
planning_state: implementation
result: pending
created_at: 2026-09-24
updated_at: 2026-09-24
base_commit: 3bdeb220cb31dfc3177faa6836f5e86c8071d1ef
objective: >
  Give a portable-pack consumer an evidence-bound explanation of preserved
  project-owned changes and conflicting updates, with optional local feedback
  export. Preserve unknown rationale as unknown and perform no automatic sharing.
authority_basis: >
  The owner explicitly added downstream customization, persistence across
  updates, rationale, and optional evidence sharing to the stable-delivery goal.
scope:
  allowed_paths:
    - .aide/scripts/aide_lite.py
    - .aide/scripts/tests/test_export_import.py
    - docs/reference/cross-repo-pack-export-import.md
    - .aide/queue/AIDE-DELIVERED-PACK-CUSTOMIZATION-01/**
    - .aide/queue/index.yaml
    - PLANS.md
    - IMPLEMENT.md
    - .aide/changelog/**
    - .aide/export/aide-lite-pack-v0/**
    - .aide/release/**
  forbidden_operations:
    - mutate live target repositories or send feedback over a network
    - infer a rationale from file bytes or stale metadata
    - main promotion, tag creation, upload, or release publication
    - hosted settings, credentials, provider, or model effects
verification:
  - project-owned configuration survives update byte-for-byte
  - conflicting direct edit blocks the whole payload apply
  - matching rationale is explained; absent or stale rationale is unknown
  - feedback exists only after an explicit local request
  - extracted-pack consumer proves delivered behavior
  - combined source and final artifact replay pass
retained_gates:
  - stable release and complete lifecycle qualification remain open
  - historical owner dispositions require exact owner decisions
