schema_version: aide.queue-task.v0
id: AIDE-APPLY-01-managed-section-patcher
title: Managed Section Patcher
status: needs_review
planning_state: implemented
created_at: 2026-06-03
updated_at: 2026-06-03
phase: managed-section-patcher
objective: Implement fixture-safe marker-based managed-section parsing, patch planning, conflict detection, rollback-compatible evidence, report-only commands, tests, golden tasks, docs, and queue evidence without enabling real repository apply behavior.
prerequisites:
