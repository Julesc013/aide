forbidden_scope:
  - active repository managed-section apply command
  - install, repair, upgrade, rollback, or uninstall apply behavior
  - target repository mutation
  - branch or worktree mutation
  - merge, push, promotion, tag, release, or publication
  - GitHub API mutation
  - provider/model/network calls
  - Gateway forwarding
  - local archive tmp promotion
review_gate: queue_review_required
acceptance:
  - Managed-section marker and operation policies exist.
  - Managed-section schemas and examples exist.
  - Core parser/patcher preserves manual content outside markers.
  - Missing, duplicate, malformed, and nested marker conflicts are detected.
  - Fixture-only commands write status, plan, validation, conflict, and next-plan reports.
  - Tests and golden tasks cover preservation, conflicts, transaction compatibility, and no-real-apply boundaries.
  - Evidence records validation, changed files, command surface, fixture proof, rollback proof, export-pack sync, next plan, and risks.
  - Status ends at needs_review.
