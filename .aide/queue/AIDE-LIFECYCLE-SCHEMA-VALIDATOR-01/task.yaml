  - .aide/examples/apply/lifecycle/**
  - .aide/scripts/aide_lite.py
  - .aide/scripts/tests/test_aide_lifecycle_schema_validator.py
  - .aide/reports/lifecycle-schema-*.md
  - .aide/reports/lifecycle-schema-*.json
  - .aide/reports/task-os-*.md
  - .aide/reports/task-os-*.json
  - .aide/reports/scoped-transaction-executor-*.md
  - .aide/reports/scoped-transaction-executor-*.json
  - .aide/reports/managed-section-*.md
  - .aide/reports/managed-section-*.json
  - .aide/reports/transaction-*.md
  - .aide/reports/transaction-*.json
  - .aide/reports/current-aide-roadmap.md
  - docs/reference/apply-lifecycle-schemas.md
  - README.md
protected_paths:
  - .git/**
  - .github/**
  - .aide.local/**
  - .env
  - .env.*
  - secrets/**
  - credentials/**
  - target repositories
  - release publication files
  - provider/model/Gateway integration files
  - branch/worktree automation files
  - active lifecycle apply implementation files
  - scoped transaction executor implementation files
  - managed-section implementation files
  - install/upgrade/repair/rollback/uninstall implementation files
  - .aide/install/**
  - .aide/repair/**
  - .aide/upgrade/**
  - .aide/rollback/**
  - .aide/uninstall/**
  - .aide/release/**
  - core/**
forbidden_scope:
  - lifecycle apply implementation
  - lifecycle apply execution
  - fixture target materialization
  - install apply implementation
  - install apply execution
  - upgrade apply implementation
  - upgrade apply execution
  - lifecycle repair apply implementation
  - lifecycle repair apply execution
  - rollback implementation
  - rollback execution
  - uninstall implementation
  - uninstall execution
  - active AIDE repo apply
  - target repo mutation
  - branch/worktree mutation
  - merge
  - push
  - promotion
  - release publication
  - GitHub mutation
  - provider/model calls
  - Gateway calls
  - network calls
  - broad active-repo apply
  - broad deletes
  - broad moves
  - production-ready claim
  - release-ready claim
validation:
  - git status --short --branch
  - git remote -v
  - git rev-parse HEAD
  - git show --stat --oneline --name-status HEAD
  - git diff --check HEAD^ HEAD
  - py -3 .aide/scripts/aide_lite.py task status
  - py -3 .aide/scripts/aide_lite.py task next-plan
  - py -3 .aide/scripts/aide_lite.py task inspect AIDE-LIFECYCLE-SCHEMA-AND-FIXTURE-PLAN-01
  - py -3 .aide/scripts/aide_lite.py task inspect --task-id AIDE-LIFECYCLE-SCHEMA-AND-FIXTURE-PLAN-01
  - py -3 .aide/scripts/aide_lite.py task evidence --task-id AIDE-LIFECYCLE-SCHEMA-AND-FIXTURE-PLAN-01
  - py -3 .aide/scripts/aide_lite.py validate
  - py -3 .aide/scripts/aide_lite.py scoped-transaction status
  - py -3 .aide/scripts/aide_lite.py managed-section status
  - py -3 .aide/scripts/aide_lite.py transaction status
  - py -3 -c "import json; print('json: available')"
  - py -3 -c "import jsonschema; print('jsonschema: available')"
  - py -3 .aide/scripts/aide_lite.py lifecycle-schema status
  - py -3 .aide/scripts/aide_lite.py lifecycle-schema validate
  - py -3 .aide/scripts/aide_lite.py lifecycle-schema fixture-verify
  - py -3 .aide/scripts/tests/test_aide_lifecycle_schema_validator.py
  - py -3 -m py_compile .aide/scripts/aide_lite.py
  - git diff --check
  - parse changed JSON files
  - boundary text searches
  - changed-file secret scan
review_gate: needs_review
schema_validator_implemented: true
schema_validation_engine: stdlib_structural_fallback
jsonschema_dependency_required: false
fixture_files_created: false
fixture_materialization_deferred: true
lifecycle_apply_implemented: false
lifecycle_apply_executed: false
selected_next_task: AIDE-LIFECYCLE-FIXTURE-MATERIALIZE-01
acceptance:
  - Task scaffold exists and is indexed.
  - AIDE Lite lifecycle-schema status, validate, and fixture-verify commands exist.
  - Validator parses lifecycle schemas and examples with stdlib JSON only.
  - Validator blocks missing schema_version, mutating example modes, protected paths, traversal paths, unsupported operations, rollback execution, target mutation, production-ready, and release-ready claims.
  - Validation reports are generated under .aide/reports/lifecycle-schema-*.
  - Targeted tests cover positive and negative validator behavior.
  - No lifecycle apply implementation or execution occurs.
  - Status ends at needs_review.
