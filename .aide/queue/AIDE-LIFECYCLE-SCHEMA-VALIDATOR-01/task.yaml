created_at: 2026-06-05
updated_at: 2026-06-05
phase: apply-lifecycle-schema-validation
objective: Wire local report-only validation for lifecycle schemas, non-mutating examples, rollback-compatible record examples, and fixture-shape examples before fixture materialization work.
selected_by: AIDE-LIFECYCLE-SCHEMA-AND-FIXTURE-PLAN-01
prerequisites:
