schema_version: aide.queue-task.v0
id: AIDE-STRUCTURE-01-root-authority-contracts
title: Root Authority Contracts
status: planning
planning_state: queue_packet_created
created_at: 2026-06-18
updated_at: 2026-06-18
owner: Codex
check_only: false
report_only: false
authorizes_implementation: true
implementation_class: contract_and_policy_docs_only
review_gate: needs_review
depends_on:
  - AIDE-STRUCTURE-00-current-truth-and-root-authority-audit
objective: >
  Convert the candidate-only root authority audit into bounded root authority
  contracts, layout guidance, overlap reports, migration rules, validation
  planning, and follow-up queue prompts without moving files, deleting files,
  rewriting references, creating new top-level roots, or changing generated
  artifact source-of-truth rules.
allowed_paths:
  - .aide/queue/AIDE-STRUCTURE-01-root-authority-contracts/**
  - .aide/queue/index.yaml
  - .aide/context/latest-task-packet.md
  - .aide/policies/root-authority.yaml
  - .aide/reports/root-authority-contracts.json
  - .aide/reports/root-authority-contracts.md
  - .aide/reports/task-os-*
  - docs/reference/repository-layout.md
  - docs/planning/repository-structure/**
  - governance/root-authority.md
  - PLANS.md
  - IMPLEMENT.md
  - DOCUMENTATION.md
read_only_inputs:
  - AGENTS.md
  - .aide/profile.yaml
  - .aide/queue/README.md
  - .aide/queue/policy.yaml
  - .aide/queue/index.yaml
  - .aide/policies/review-gates.yaml
  - .aide/policies/work-units.yaml
  - .aide/policies/task-resumption.yaml
  - .aide/policies/recovery.yaml
  - docs/reference/source-of-truth.md
  - docs/reference/repo-intelligence-index.md
  - docs/reference/root-recycling-framework.md
  - docs/reference/refactor-control-plane.md
  - docs/reference/move-salvage-path-aliases.md
  - .aide/reports/structure-current-state.md
  - .aide/roots/latest-root-authority-candidates.md
  - docs/planning/repository-structure/current-truth-and-root-authority-audit.md
forbidden_scope:
  - file_moves
  - file_deletes
  - reference_rewrites
  - path_alias_application
  - shim_creation
  - new_top_level_root_creation
  - generated_artifact_source_of_truth_promotion
  - generated_artifact_drift_acceptance_changes
  - queue_acceptance_mutation
  - root_recycling_apply
  - refactor_map_apply
  - broad_docs_repair
  - okf_refresh
  - runtime_implementation
  - service_or_commander
  - host_or_provider_runtime
  - target_repo_mutation
  - branch_mutation
  - github_mutation
  - release_or_publishing
  - provider_model_calls
  - network_calls
acceptance:
  - Queue item exists, is indexed, and records the dependency on AIDE-STRUCTURE-00.
  - Machine-readable root authority policy exists and classifies current tracked roots by authority, status, risk, canonicality, and allowed future mutation posture.
  - Human-readable root authority governance note exists and preserves source-of-truth, generated-output, queue, evidence, and no-apply boundaries.
  - Repository layout reference exists and records the current closed root model, overlap report, candidate target structure, migration rules, validation plan, and follow-up prompts.
  - Reports record the root authority map and explicit non-authorizations.
  - Follow-up Track B prompts are materialized for review without creating new top-level roots or authorizing structural apply behavior.
  - Evidence includes changed files, validation commands/results, no-forbidden-ops review, and remaining risks.
  - Task stops at needs_review.
validation:
  - git status --short --branch
  - py -3 .aide/scripts/aide_lite.py doctor
  - py -3 .aide/scripts/aide_lite.py validate
  - py -3 .aide/scripts/aide_lite.py task status
  - py -3 .aide/scripts/aide_lite.py task inspect --task-id AIDE-STRUCTURE-01-root-authority-contracts
  - py -3 .aide/scripts/aide_lite.py task evidence --task-id AIDE-STRUCTURE-01-root-authority-contracts
  - git diff --check
  - py -3 .aide/scripts/aide_lite.py commit check --latest
stop_state: needs_review
non_goals:
  - no file movement
  - no deletion or archive application
  - no reference rewrite
  - no path alias or shim creation
  - no new top-level root creation
  - no generated artifact authority promotion
  - no queue acceptance or predecessor promotion
  - no CapabilityManifest acceptance
  - no ConformanceProfile, PatchTransaction, AdapterManifest, ContextPack, runtime, worker, host, provider, Service, Commander, Workbench, or legacy bridge implementation
  - no target-repo mutation
  - no branch mutation
  - no GitHub, provider/model, network, release, or publishing action
