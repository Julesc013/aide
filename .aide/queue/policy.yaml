schema_version: aide.queue-policy.v0
concurrency:
  default: 1
worktree:
  require_clean_where_practical: true
  preserve_unrelated_user_changes: true
evidence:
  required: true
  location: task-local-evidence-directory
  minimum_contents:
    - changed_files
    - validation_commands
    - validation_results
    - blockers_or_deferrals
scope_control:
  require_allowed_paths: true
  no_silent_permission_widening: true
  stop_on_blocker: true
  stop_on_review_gate: true
  no_hidden_generated_file_drift: true
  deterministic_outputs_required: true
task_states:
  - pending
  - claimed
  - planning
  - running
  - blocked
  - needs_review
  - passed
  - failed
  - superseded
review_gate_policy: .aide/policies/review-gates.yaml
campaign_owner_delegation:
  campaign_id: AIDE-CONVERGENCE-AND-DELIVERY-01
  authority_ref: .aide/queue/AIDE-CONVERGENCE-AND-DELIVERY-01/evidence/owner-delegation-2026-09-25.md
  resolution_rule: >
    Stop at every applicable review gate. Only an exact child WorkUnit under
    this campaign may use the recorded owner delegation for the owner-response
    portion; resolve technical and effect gates by the independent verdict,
    checks, and manifest conditions in review-gates.yaml. Other queue work
    follows the ordinary human-review route.
autonomy_policy: .aide/policies/autonomy.yaml
bypass_policy: .aide/policies/bypass.yaml
