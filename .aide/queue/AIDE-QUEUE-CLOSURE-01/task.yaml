schema_version: aide.queue-task.v0
id: AIDE-QUEUE-CLOSURE-01
title: Blocker Graph and Closure Plan
status: needs_review
planning_state: report_only_completed
created_at: 2026-06-04
updated_at: 2026-06-04
phase: queue-closure-report-only
objective: Build a report-only blocker/dependency graph for current AIDE queue state, evidence, validation surfaces, prohibitions, stale reports, and missing authority, then select the smallest safe next closure batch without bypassing prohibitions.
prerequisites:
  - AIDE-APPLY-02-scoped-transaction-executor-v0
allowed_paths:
  - .aide/queue/AIDE-QUEUE-CLOSURE-01/**
  - .aide/queue/index.yaml
protected_paths:
  - .git/**
  - .github/**
  - .aide.local/**
  - .env
  - .env.*
  - secrets/**
  - credentials/**
  - target repositories
  - release publication files
  - provider/model/Gateway integration files
  - branch/worktree automation files
  - implementation files outside this task
forbidden_scope:
  - implementation file mutation
  - apply automation
  - install apply
  - upgrade apply
  - repair apply
  - rollback/uninstall apply
  - target repo mutation
  - branch/worktree mutation
  - merge
  - push
  - promotion
  - release publication
  - GitHub mutation
  - provider/model calls
  - Gateway calls
  - network calls
  - broad active-repo apply
  - broad deletes
  - broad moves
review_gate: queue_review_required
acceptance:
  - Queue closure task packet exists.
  - Report-only blocker graph exists.
  - Closure plan exists.
  - Safe next batch recommendation exists.
  - Machine-readable graph summary exists.
  - Validation evidence records commands and generated report churn disposition.
  - No implementation, apply, target, branch, release, GitHub, provider/model, Gateway, or network mutation is performed.
  - Status ends at needs_review.
