  - The review records whether managed-section records are modeled without patcher implementation.
  - The review records whether any real apply, target mutation, branch/worktree mutation, GitHub mutation, provider/model/network call, Gateway call, release publication, or install/repair/upgrade/rollback/uninstall apply behavior is present.
  - Evidence records changed files, validation, review findings, no-real-apply proof, remaining risks, and next plan.
