  - .aide/evals/runs/latest-golden-tasks.*
  - .aide/intake/latest-*
  - .aide/git/latest-helper-plan.*
  - .aide/git/aide-dev-main-plan.*
  - .aide/context/latest-task-packet.md
  - .aide/context/latest-review-packet.md
  - .aide/routing/latest-route-decision.*
  - PLANS.md
  - IMPLEMENT.md
forbidden_scope:
