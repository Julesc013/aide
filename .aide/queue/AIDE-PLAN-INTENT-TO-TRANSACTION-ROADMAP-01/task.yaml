  bridges map AIDE concepts into domain law; capability providers execute
  declared deterministic operations; and Workbench/Commander/mobile/CLI are
  views over shared WorkUnit, transaction, evidence, and event state.
planning_decisions:
  - Preserve the accepted ContextPack v2 route to AIDE-BUILD-INTEROP-EXPORTS-01.
