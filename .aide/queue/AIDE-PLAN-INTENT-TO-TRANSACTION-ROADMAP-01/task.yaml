  - Introduce CapabilityInvocation before broad Host Contract execution.
  - Keep PatchTransaction v1 file-oriented and no-apply.
  - Add DevelopmentTransaction and PreviewSession before Workbench mutation work.
  - Prefer validation and document preview slices before scene mutation.
  - Require every new contract family to prove itself through a narrow vertical slice.
